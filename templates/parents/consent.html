{% extends "parents/base.html" %}
{% block title %}{{ t.consent_title }}{% endblock %}
{% block content %}
<div class="stack" style="--gap:10px;margin-top:16px">
  <h1>{{ t.consent_title }}</h1>
  <p>{{ t.consent_body }}</p>
  <ul class="stack" style="--gap:4px;padding-left:18px;margin:0">{% for k in kids %}<li>{{ k.name }} · {{ k.batch.name }}</li>{% endfor %}</ul>
</div>
<form method="post" class="stack">
  {% csrf_token %}
  <label class="row" style="--gap:12px;align-items:flex-start;font-size:15px">
    <input type="checkbox" name="agree" value="yes" style="width:22px;height:22px;margin-top:2px" required>
    <span>{{ t.consent_agree }}</span>
  </label>
  <button class="btn btn-primary btn-lg" type="submit">{{ t.continue }}</button>
</form>
<form method="post" action="{% url 'parents:logout' %}" data-no-busy>{% csrf_token %}<button class="btn-link btn" type="submit">{{ t.sign_out }}</button></form>
{% endblock %}
