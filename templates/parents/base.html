{% extends "base.html" %}
{% block lang %}{{ lang }}{% endblock %}
{% block body %}
<div class="phone">
  <header class="phone-head">
    <div class="row" style="--gap:10px"><span class="logo" aria-hidden="true">A</span><strong>Company A</strong></div>
    <form class="lang" method="post" action="{% url 'parents:language' %}" role="group" aria-label="Language / भाषा" data-no-busy>
      {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" name="lang" value="hi" aria-pressed="{% if lang == 'hi' %}true{% else %}false{% endif %}" lang="hi">हिं</button>
      <button type="submit" name="lang" value="en" aria-pressed="{% if lang == 'en' %}true{% else %}false{% endif %}">EN</button>
    </form>
  </header>
  <main id="main" class="phone-main">
    {% include "_messages.html" %}
    {% block content %}{% endblock %}
  </main>
  {% if tab %}
  <nav class="tabbar" aria-label="Main" style="--tabs:3">
    <a href="{% url 'parents:home' %}" {% if tab == 'dues' %}aria-current="page"{% endif %}>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
      {{ t.tab_dues }}</a>
    <a href="{% url 'parents:receipts' %}" {% if tab == 'receipts' %}aria-current="page"{% endif %}>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      {{ t.tab_receipts }}</a>
    <a href="{% url 'parents:progress' %}" {% if tab == 'progress' %}aria-current="page"{% endif %}>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      {{ t.tab_progress }}</a>
  </nav>
  {% endif %}
</div>
{% endblock %}
