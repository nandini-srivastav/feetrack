# Render Blueprint: one web service + one Postgres database.
# Secrets are generated by Render or entered in its dashboard, never committed.
databases:
  - name: feetrack-db
    plan: free
    databaseName: feetrack
    user: feetrack

services:
  - type: web
    name: feetrack
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Migrations and the first-time seed run on start (the free plan has no
    # pre-deploy step). seed_demo --if-empty never overwrites existing data.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_demo --if-empty &&
      gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "0"
      - key: DEMO_MODE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: GATEWAY_WEBHOOK_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: feetrack-db
          property: connectionString

